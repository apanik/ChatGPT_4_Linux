[package]
name = "codex-chatgpt-client"
version = "0.1.0"
edition = "2021"
description = "Unofficial Linux ChatGPT desktop client"
authors = ["OpenAI Codex"]
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tauri = { version = "1", features = ["shell-open", "system-tray", "global-shortcut", "dialog", "notification", "fs-all", "updater", "process-command-api", "clipboard", "window-set-position", "window-set-size", "http-request"] }
url = "2"
parking_lot = "0.12"
dirs = "5"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dev-dependencies]
tempfile = "3"
